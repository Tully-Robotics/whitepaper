name: Deploy to Vercel

# main        → production (https://<your domain>), after running the database migrations
# any branch  → preview deployment with its own URL (shown in the run summary), and https://dev.tully-robotics.com
#               then points at it: the branch pushed last is the one dev. shows
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Set deployment target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TARGET=production" >> "$GITHUB_ENV"
            echo "PROD_FLAG=--prod" >> "$GITHUB_ENV"
          else
            echo "TARGET=preview" >> "$GITHUB_ENV"
            echo "PROD_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel project settings
        # --git-branch picks up preview variables scoped to this branch, if you set any
        run: vercel pull --yes --environment=$TARGET --git-branch="${{ github.ref_name }}" --token=${{ secrets.VERCEL_TOKEN }}

      # Production only: apply pending migrations before the new code goes live. A failed migration
      # stops the deploy, and each migration runs in a transaction, so the database is left as it was.
      # Previews do not migrate: unless you give Preview its own DATABASE_URL, they share the production database.
      - name: Install dependencies
        if: env.TARGET == 'production'
        run: npm ci --no-audit --no-fund

      - name: Run database migrations
        if: env.TARGET == 'production'
        env:
          # Optional fallback, only needed if `vercel pull` does not write the URL (sensitive variable)
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate -- --env .vercel/.env.production.local

      - name: Build
        run: vercel build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }} | grep -oE 'https://[^"]+\.vercel\.app' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${TARGET^} deployment of \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # Every branch except main: dev.tully-robotics.com now shows this preview. An alias, not a project domain, so production
      # deploys never take it back. Vercel runs the DNS for tully-robotics.com, so the subdomain and its certificate come with it.
      # Through the REST API rather than `vercel alias set`, which looks up a user for the token and fails in CI ("User not found").
      - name: Point dev.tully-robotics.com at this preview
        if: env.TARGET == 'preview'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$URL" || { echo "No deployment URL found in the deploy output"; exit 1; }
          api="https://api.vercel.com"; auth="Authorization: Bearer $TOKEN"
          id=$(curl -sS --fail-with-body -H "$auth" "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          [ -n "$id" ] && [ "$id" != null ] || { echo "Could not look up the deployment $URL"; exit 1; }
          point() { curl -sS -o alias.json -w '%{http_code}' -X POST -H "$auth" -H "Content-Type: application/json" \
            -d '{"alias":"dev.tully-robotics.com"}' "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"; }
          code=$(point)
          # the first time, the subdomain has no certificate yet: issue one (Vercel renews it), then try again
          if [ "$code" = 400 ] && grep -q cert_missing alias.json; then
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" -d '{"cns":["dev.tully-robotics.com"]}' \
              "$api/v8/certs?teamId=$VERCEL_ORG_ID"; echo
            code=$(point)
          fi
          cat alias.json; echo
          [ "$code" = 200 ] || { echo "Could not point dev.tully-robotics.com at $URL (HTTP $code)"; exit 1; }
          echo "Also live at https://dev.tully-robotics.com" >> "$GITHUB_STEP_SUMMARY"
